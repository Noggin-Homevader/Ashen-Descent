# One-click deploy of the Ashen Descent multiplayer relay to Render (free plan).
# https://render.com/deploy?repo=https://github.com/Noggin-Homevader/Ashen-Descent
services:
  - type: web
    name: ashen-descent-relay
    runtime: node
    plan: free
    buildCommand: "echo 'no build needed'"
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
