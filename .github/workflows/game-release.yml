name: Game release

# Releases the game whenever main has a game version that has not been released yet.
# To ship an update: put the new build in game/app/, bump "version" in game/game.json, add a section to
# game/CHANGELOG.md, and merge to main. This workflow tests, packages, verifies and PUBLISHES release vX.Y.Z;
# launchers install it the next time they open. Versions with a prerelease part (2.1.0-beta.1) are published as
# prereleases, which launchers only offer with "Include test builds" switched on.

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'tools/package-game.js'
      - '.github/workflows/game-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Is this version already released?
        id: v
        run: |
          v=$(node -p "require('./game/game.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Game v$v is already released. Bump the version in game/game.json to release again." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Launcher tests
        if: steps.v.outputs.skip != 'true'
        run: node --test "launcher/test/*.test.js"
      - name: Package the game and write the manifest
        if: steps.v.outputs.skip != 'true'
        run: node tools/package-game.js --tag "v${{ steps.v.outputs.version }}" --out dist/game
      - name: Verify the release files
        if: steps.v.outputs.skip != 'true'
        run: node tools/verify-release.js dist/game --tag "v${{ steps.v.outputs.version }}"
      - name: Publish the release
        if: steps.v.outputs.skip != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          flags=(--target "$GITHUB_SHA" --latest=false)
          if [[ "$V" == *-* ]]; then flags+=(--prerelease); fi
          # --latest=false keeps the launcher as the repository's "latest release", so the installer link never changes.
          gh release create "v$V" dist/game/* --title "Ashen Descent $V" --notes-file dist/game/release-notes.md "${flags[@]}"
          echo "Published game release v$V." >> "$GITHUB_STEP_SUMMARY"
