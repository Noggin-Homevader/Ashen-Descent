name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The launcher's update code has no dependencies, so the tests need no npm install.
      - name: Launcher tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tools/gh-annotate-reporter.mjs --test-reporter-destination=stdout "launcher/test/*.test.js"

  package:
    name: Package the game (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/package-game.js --out dist/game
      - run: node tools/verify-release.js dist/game
