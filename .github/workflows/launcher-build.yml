name: Launcher build

# Builds the launcher installers for Windows, macOS and Linux.
# - Run it by hand (Actions > Launcher build > Run workflow) to get the installers as workflow artifacts.
# - Push a tag like launcher-v1.0.1 to also attach them to a DRAFT release for that tag.
# Launcher releases use the "launcher-v" prefix, so the launcher never mistakes them for game updates.

on:
  push:
    tags: ['launcher-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "launcher-v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v" >&2; exit 1; }
      - run: npm install --no-audit --no-fund
      # Full tests run on every OS in the CI workflow; here they gate the build once.
      - run: npm test
        if: runner.os == 'Linux'
      - name: Build installers
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned until signing certificates are added (see docs/LAUNCHER.md)
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.os }}
          path: |
            dist/launcher/*.exe
            dist/launcher/*.dmg
            dist/launcher/*.AppImage
          if-no-files-found: error

  draft-release:
    # Publish whatever built, even if one OS failed, so a Windows installer is not held back by a macOS problem.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/launcher-v') }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the draft launcher release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --verify-tag \
            --title "Ashen Descent Launcher ${GITHUB_REF_NAME#launcher-v}" \
            --notes "**Windows:** download AshenDescent-Setup-*.exe and double-click it. It installs in a few seconds, adds desktop and Start menu shortcuts, opens the launcher, and the launcher downloads the game. The installer is not code-signed yet, so Windows may show *Windows protected your PC*: choose **More info**, then **Run anyway**. **macOS:** open the .dmg and drag Ashen Descent to Applications. **Linux:** make the .AppImage executable and run it."
